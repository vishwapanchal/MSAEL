name: msa-ci

on:
  push:
    paths:
      - "msa/**"
      - ".github/workflows/msa-ci.yaml"
  pull_request:
    paths:
      - "msa/**"
      - ".github/workflows/msa-ci.yaml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msa/services/reviews-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reviews-service:1.0.0 msa/services/reviews-service
      - run: docker build -t reviews-service:1.1.0 --build-arg APP_VERSION=1.1.0 msa/services/reviews-service

  kustomize-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize msa/deploy/overlays/dev
      - run: kubectl kustomize msa/deploy/overlays/staging

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: msa/iac/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  kind-smoke:
    runs-on: ubuntu-latest
    needs: [pytest, docker-build, kustomize-render]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: helm/kind-action@v1
      - name: Build image
        run: docker build -t reviews-service:1.0.0 msa/services/reviews-service
      - name: Load image into kind
        run: kind load docker-image reviews-service:1.0.0
      - name: Deploy staging overlay
        run: |
          kubectl create namespace boutique-staging
          kubectl apply -k msa/deploy/overlays/staging
      - name: Wait for rollout
        run: kubectl -n boutique-staging rollout status deployment/reviews-service --timeout=180s
      - name: Smoke test
        run: |
          kubectl -n boutique-staging port-forward svc/reviews-service 8081:8080 &
          sleep 5
          python msa/services/reviews-service/smoke_test.py http://localhost:8081
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n boutique-staging get pods,pvc -o wide
          kubectl -n boutique-staging describe pods
