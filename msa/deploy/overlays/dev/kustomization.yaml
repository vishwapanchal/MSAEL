apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique-dev
resources:
  - ../../base
labels:
  - pairs:
      environment: dev
    includeSelectors: false
images:
  - name: reviews-service
    newTag: 1.1.0
patches:
  - target:
      kind: ConfigMap
      name: reviews-service-config
    patch: |-
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
